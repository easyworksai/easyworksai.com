<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Resources — The Bench</title>
<style>
:root{--ink:#070b16;--ink2:#0c1222;--steel:#1c2740;--blue:#3b82f6;--cyan:#22d3ee;--gold:#e8b25a;--text:#f5f7ff;--muted:#94a3b8}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:28px 18px 60px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.top a{color:var(--cyan);text-decoration:none;font-size:14px}
h1{font-size:26px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 22px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:var(--ink2);border:1px solid var(--steel);border-radius:14px;padding:16px;text-decoration:none;color:var(--text);display:block;position:relative;transition:border-color .15s}
.card:hover{border-color:var(--blue)}.card .code{font:600 11px/1 ui-monospace,Menlo,monospace;color:var(--cyan);letter-spacing:.06em}
.card h3{margin:8px 0 6px;font-size:16px;line-height:1.3}.card p{margin:0;color:var(--muted);font-size:13px}
.card .meta{margin-top:10px;font-size:12px;color:var(--muted)}.card.first{border-color:var(--gold)}
.card.first .code{color:var(--gold)}
.empty{color:var(--muted);padding:30px;border:1px dashed var(--steel);border-radius:14px;text-align:center}
.login{max-width:380px;margin:80px auto;text-align:center}.login input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--steel);background:var(--ink2);color:var(--text);font-size:16px;text-align:center;letter-spacing:.08em}
.login button{margin-top:10px;width:100%;padding:12px;border-radius:10px;border:0;background:var(--blue);color:#fff;font-weight:600;font-size:15px}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="/team/work/">&larr; Back to The Bench</a><span id="who" style="color:var(--muted);font-size:13px"></span></div>
  <h1>Resources</h1>
  <p class="sub">The SOP library. Start with the Library Guide, then How We Work. Each PDF has a code and version in the footer; the copy here is always the current one.</p>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hide">Nothing published yet.</div>
  <div id="login" class="login hide"><p>Enter your access code to open the library.</p><input id="code" placeholder="EW-XXXX-0000" autocomplete="off"><button id="go">Open</button><p id="err" style="color:#f87171"></p></div>
</div>
<script>
const API='/.netlify/functions/';
async function api(p,o){const r=await fetch(API+p,{credentials:'same-origin',...o});return {ok:r.ok,status:r.status,data:await r.json().catch(()=>({}))}}
async function load(){
  const r=await api('team-resources?list=1');
  if(r.status===401){document.getElementById('login').classList.remove('hide');return}
  const docs=(r.data.docs||[]);const g=document.getElementById('grid');
  if(!docs.length){document.getElementById('empty').classList.remove('hide');return}
  g.innerHTML=docs.map((d,i)=>`<a class="card${i===0?' first':''}" href="${API}team-resources?file=${encodeURIComponent(d.code)}" target="_blank" rel="noopener">
    <div class="code">${d.code}</div><h3>${d.title}</h3><p>${d.blurb||''}</p><div class="meta">v${d.version||'1.0'} &middot; ${d.pages||'?'} pages &middot; ${d.kicker||'SOP'}</div></a>`).join('');
}
document.getElementById('go').onclick=async()=>{
  const code=document.getElementById('code').value.trim().toUpperCase();
  const r=await api('team-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code})});
  if(!r.ok){document.getElementById('err').textContent=r.data.error||'That code did not work.';return}
  location.reload();
};
load();
</script>
</body>
</html>
