<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Easyworks">
  <!-- Header mark (2026-09-18). Same geometry as the 3D landing mark, drawn in the same
       materials so the two read as one logo: steel body, gold edge, blue core. Vector, so it
       stays sharp at 28px where a shrunken render turned to mud. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f6d48a"/><stop offset=".5" stop-color="#c8913a"/><stop offset="1" stop-color="#f0c46e"/></linearGradient>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a4a66"/><stop offset=".45" stop-color="#0c1322"/><stop offset="1" stop-color="#1c2a44"/></linearGradient>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43.27 10.81A24 24 0 1 0 54.83 24.58" stroke="url(#g)" stroke-width="9.6"/>
    <path d="M43.27 10.81A24 24 0 1 0 54.83 24.58" stroke="url(#s)" stroke-width="7.4"/>
    <g>
      <path d="M44 32A12 12 0 1 0 37.07 42.88M20 32H44" stroke="url(#g)" stroke-width="9"/>
      <path d="M44 32A12 12 0 1 0 37.07 42.88M20 32H44" stroke="url(#s)" stroke-width="6.8"/>
      <path d="M44 32A12 12 0 1 0 37.07 42.88M20 32H44" stroke="url(#b)" stroke-width="2.2"/>
    </g>
  </g>
</svg>
