<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Easyworks AI">
  <defs>
    <linearGradient id="ewBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1424"/>
      <stop offset="1" stop-color="#070b16"/>
    </linearGradient>
    <linearGradient id="ewBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="ewBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="ewCyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Rounded square frame -->
  <rect width="64" height="64" rx="14" fill="url(#ewBg)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#ewBorder)" stroke-width="1.2"/>

  <!-- Three stacked engine bars forming an E -->
  <rect x="14" y="17" width="30" height="6" rx="3" fill="url(#ewBlue)"/>
  <rect x="14" y="29" width="34" height="6" rx="3" fill="url(#ewCyan)"/>
  <path d="M48 29 L55 32 L48 35 Z" fill="#22d3ee"/>
  <rect x="14" y="41" width="24" height="6" rx="3" fill="url(#ewBlue)"/>
</svg>
