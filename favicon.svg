<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Easyworks">
  <!-- The Easyworks mark (v4, 2026-09-10). A bold lowercase e inside a thick open
       ring that breaks at the upper right: one confident circular motion. Blue to
       cyan stroke with a thin gold hairline inlay (gold = the brand's premium
       signal). Circle badge. Same geometry renders flat (print), polished chrome
       (light surfaces) or gold-inlaid obsidian (hero). Original mark, built in-house. -->
  <defs>
    <linearGradient id="ewBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0c1424"/><stop offset="1" stop-color="#070b16"/></linearGradient>
    <linearGradient id="ewSt" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
  </defs>
  <circle cx="32" cy="32" r="32" fill="url(#ewBg)"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M43.27 10.81 A24 24 0 1 0 54.83 24.58" stroke="url(#ewSt)" stroke-width="8"/>
    <path d="M44 32 A12 12 0 1 0 37.07 42.88" stroke="url(#ewSt)" stroke-width="7.5"/>
    <path d="M20 32 H44" stroke="url(#ewSt)" stroke-width="7.5"/>
    <path d="M43.27 10.81 A24 24 0 1 0 54.83 24.58" stroke="#e8b25a" stroke-width="1.1" opacity=".95"/>
    <path d="M44 32 A12 12 0 1 0 37.07 42.88" stroke="#e8b25a" stroke-width="1.1" opacity=".95"/>
    <path d="M20 32 H44" stroke="#e8b25a" stroke-width="1.1" opacity=".95"/>
  </g>
</svg>
